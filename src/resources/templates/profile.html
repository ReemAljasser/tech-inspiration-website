<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ملفي الشخصي</title>
  <link rel="stylesheet" href="style.css" />
  <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap');
    .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, #4a0b72, #2f0e54);
    padding: 10px 10px;
    box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);
    font-family: 'Tajawal', sans-serif;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
}

.top-nav img {
    height: 120px;
    width: 120px;
}

.top-nav nav ul {
    list-style: none;
    display: flex;
    gap: 15px;
    margin: 0;
    padding: 0;
}

.top-nav nav ul li {
    display: inline-block;
}

.top-nav nav ul li a {
    text-decoration: none;
    color: white;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s ease;
}

.top-nav nav ul li a i {
    font-size: 20px;
    margin-bottom: 3px;
}

.top-nav nav ul li a:hover {
    color: #f39c12;
    transform: scale(1.1);
}
.h1{
  top: 20px;
  line-height: 20%;
}
.i{
  margin-left: 50px;
}

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4CAF50;
      padding: 15px 0;
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 200px auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #4a0b72;
      margin-bottom: 20px;
    }

    .btn-logout {
      background-color: #f44336;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    
  </style>
</head>
<body>

  <header class="top-nav">
    <img src="./src/assets/images/logo.png" alt="">
      <nav>
          <ul>              
                <a href="index.html" id="logout-link">تسجيل الخروج</a>
                <li><a href="contact.html">تواصل معنا</a></li>
                <li><a href="ProfessionalCertificates.html"></i> الشهادات الاحترافية</a></li>
                <li><a href="Lectures.html"> المحاضرات</a></li>
                <li><a href="camp.html"> المعسكرات</a></li>
                <li><a href="about.html"> من نحن</a></li>
                <li><a href="profile.html"> ملفي الشخصي</a></li>
                <li><a href="index.html"> الرئيسية</a></li>
            </ul>
      </div>
    </nav>
  </header>

  <div class="container">
    <h1>مرحبًا بك في صفحتك الشخصية</h1>
    <p id="user-info">جاري تحميل بيانات المستخدم...</p>
    <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBdIqikaUi4H-Fb2KraOm8mTj0jr7hGezA",
  authDomain: "tech-inspiration-2c580.firebaseapp.com",
  projectId: "tech-inspiration-2c580",
  storageBucket: "tech-inspiration-2c580.appspot.com",
  messagingSenderId: "758463374939",
  appId: "1:758463374939:web:1bb8e0459fe076c3be417e"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // التحقق من حالة تسجيل الدخول
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("user-info").textContent = `أهلاً بك، ${user.email}`;
      } else {
        // تحويل غير المسجلين للـ login
        window.location.href = "login.html";
      }
    });

    // تسجيل الخروج
    window.logout = function() {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    };
  </script>
</body>
</html>
