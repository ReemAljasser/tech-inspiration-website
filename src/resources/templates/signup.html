  <script type="module">
    import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
    import { auth, db } from './firebaseConfig.js';
    import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { setDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    export default {
  data() {
    return {
      selectedInterests: [], // هذي اللي بنرسلها
      allInterests: ['برمجة', 'ذكاء اصطناعي', 'أمن سيبراني', 'تحليل بيانات','تصميم','artificial intelligence','machine learning course','Science & Technology','Master/Certification','Master/Science']
    };
  }
};
    createApp({
      setup() {
        const email = ref('');
        const name = ref('');
        const password = ref('');
        const confirmPassword = ref('');
        const interests = ref([]);
        const error = ref('');

        const signup = async () => {
          error.value = '';

          if (!email.value || !password.value || !confirmPassword.value ||!name.value ) {
            error.value = 'يرجى ملء جميع الحقول.';
            return;
          }

          if (password.value !== confirmPassword.value) {
            error.value = 'كلمة المرور وتأكيدها غير متطابقتين.';
            return;
          }

          if (password.value.length < 6) {
            error.value = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.';
            return;
          }

          try {
            const userCredential = await createUserWithEmailAndPassword(auth, email.value, password.value);
            const user = userCredential.user;

            await setDoc(doc(db, 'users', user.uid), {
              name: name.value,
              email: email.value,
              interests: interests.value.length > 0 ? interests.value : [],  // تأكد أن المصفوفة ليست فارغة  
              createdAt: new Date()
            });

            alert('تم إنشاء الحساب بنجاح!');
            window.location.href = 'login.html';
          } catch (e) {
            if (e.code === 'auth/email-already-in-use') {
              error.value = 'البريد الإلكتروني مستخدم بالفعل.';
            } else if (e.code === 'auth/invalid-email') {
              error.value = 'البريد الإلكتروني غير صالح.';
            } else if (e.code === 'auth/weak-password') {
              error.value = 'كلمة المرور ضعيفة.';
            } else {
              error.value = 'حدث خطأ: ' + e.message;
            }
          }
        };

        return { email, password, confirmPassword,name,interests, error, signup };
      }
    }).mount('#app');
  </script>
