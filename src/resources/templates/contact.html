<body>
  <header class="top-nav">
    <img src="./src/assets/images/logo.png" alt="">
    <nav>
      <ul>
        <li><a href="contact.html">تواصل معنا</a></li>

        <li><a href="index.html"></i> الرئيسية</a></li>
    </ul>
    </nav>
  </header>

  <div id="app" class="container" style="margin-top: 150px;">
    <header>
      <h1>اتصل بنا</h1>
      <p>نحن هنا للمساعدة! يمكنك التواصل معنا من خلال النموذج أدناه</p>
    </header>

    <section id="contact-form" class="card">
      <form id="contactForm">
        <label for="name">الاسم:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">رسالتك:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">إرسال</button>
      </form>
    </section>

    <footer>
      <p>جميع الحقوق محفوظة © 2025 Tech-Inspire</p>
    </footer>
  </div>

  <!-- Firebase & إرسال البيانات -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdIqikaUi4H-Fb2KraOm8mTj0jr7hGezA",
      authDomain: "tech-inspiration-2c580.firebaseapp.com",
      projectId: "tech-inspiration-2c580",
      storageBucket: "tech-inspiration-2c580.appspot.com",
      messagingSenderId: "758463374939",
      appId: "1:758463374939:web:1bb8e0459fe076c3be417e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("contactForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const message = form.message.value.trim();

      try {
        await addDoc(collection(db, "contactMessages"), {
          name,
          email,
          message,
          timestamp: new Date()
        });

        alert("✅ تم إرسال رسالتك بنجاح!");
        form.reset();
      } catch (error) {
        console.error("❌ حدث خطأ أثناء إرسال الرسالة: ", error);
        alert("حدث خطأ، حاول مرة أخرى لاحقًا.");
      }
    });
  </script>

  <style>

    .btn {
