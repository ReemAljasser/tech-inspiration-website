      <h1 class="text-center mb-4">المحاضرات التقنية الحالية</h1>
      <div class="row" v-if="bootlectures.length > 0">
        <div class="col-md-4" v-for="bootlectures in bootlectures" :key="bootlectures.id">
          <div class="card mb-4">
            <img :src="bootlectures.image" class="card-img-top" alt="محاضرة تقنية">
            <div class="card-body">
              <h5 class="card-title">{{ bootlectures.name }}</h5>
              <h6 v-show="bootlectures.showDescription" class="card-text">{{ bootlectures.description }}</h6>
              <button @click="toggleDescription(bootlectures)" class="btn btn-secondary">
                <i :class="bootlectures.showDescription ? 'fas fa-chevron-up' : 'fas fa-chevron-down'"></i>
              </button>
              <a :href="bootlectures.link" class="btn btn-primary" target="_blank">مزيد من التفاصيل</a>
            </div>
          </div>
        </div>
      </div>
      <p v-else class="text-center">لا توجد محاضرات حالياً.</p>
    </div>
  </div>
